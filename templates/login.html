<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmoCare - Login</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/logo.jpeg') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">


    <link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">

    <!-- External CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="container">

    <!-- LEFT SECTION -->
    <div class="left">

        <div class="brand">
            <img src="{{ url_for('static', filename='images/logo.jpeg') }}"
                 alt="EmoCare Logo">
            <h2>EmoCare</h2>
        </div>

        <h1>Welcome Back!</h1>
        <p>Login to continue using EmoCare.</p>

        <form method="POST" action="/login">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input 
                           type="password"
                           id="loginPassword"
                           name="password"
                           placeholder="Enter your password"
                           required>

                    <span id="togglePassword">👁</span>
                </div>
            </div>

            <div class="options">
                <div>
                    <input type="checkbox"> Remember me
                </div>

                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register">
                Don’t have an account?
                <a href="/register">Register</a>
            </div>

        </form>

    </div>

    <!-- RIGHT SECTION -->
    <div class="right">
        <img src="{{ url_for('static', filename='images/robot.png') }}"
             alt="Robot"
             class="robot">
    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<div id="toast" class="toast"></div>

</body>
</html>
