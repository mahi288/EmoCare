<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | EmoCare</title>

    <link rel="icon" type="image/jpeg"
          href="{{ url_for('static', filename='images/logo.jpeg') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="login-container">

    <img src="{{ url_for('static', filename='images/logo.jpeg') }}"
         alt="Logo"
         class="login-logo">

    <h2>Forgot Password</h2>

    <p>Enter your registered email address to receive an OTP.</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('forgot_password') }}" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <div style="margin-top:20px;">

        <a href="{{ url_for('login') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
